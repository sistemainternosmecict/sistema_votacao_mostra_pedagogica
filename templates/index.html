{% extends "template.html" %} {% block content %}

<style>

html,
body {
  display: flex;
  border: 0;
  margin: 0;
  padding: 0;
  height: 100vh;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(0deg, rgb(217, 242, 242) 0%, rgba(255, 255, 255, 1) 100%);
}

aside {
  display: none;
}

header {
  display: flex;
  justify-content: center;
  figure {
    img {
      width: 900px;
      mix-blend-mode: multiply;
    }
  }
}

div#content {
  width: 100%;
}

section#inicio {
  width: 100vw;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

section#inicio > article {
  margin-top: 64px;
  padding: 8px;
  text-align: center;
  border-radius: 8px;

  a {
    text-decoration: none;
    padding: 8px;
    background-color: #008080;
    color: white;
    transition: all 0.2s ease-in-out;
  }

  a:hover{
    background-color: white;
    color: #008080;
    border: solid 1px #008080;
  }
}

section#fim{
  width: 500px;
  margin: 0 auto;
  text-align: center;
  padding: 16px;
  border: solid 1px #008080;
  border-radius: 8px;
}

section#rank{
  article{
    table, th, td {
      border: solid 1px #008080;
    }

    td{
      padding: 4px;
    }

    table{
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border-collapse: collapse;

      thead{
        font-weight: bold;
      }

      tr:nth-child(even){
        background-color: #008080;
        color: white;
      }
    }
  }
}


.hidden{
  display: none;
}
</style>

<section id="inicio">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <article>
    <h1 class="important">
      Bem-vindo ao sistema de votação da Mostra Pedagógica.
    </h1>
    <p id="mensagens">Por favor, aguarde o início da votação.</p>
    <h3 id="btn" class="{% if status == 0 %}hidden{% else %}{% endif %}"><a href="/inicio">COMEÇAR</a></h3>
  </article>
</section>

<script>
    const socket = io();

    socket.on('connect', () => {
        console.log('Conectado ao servidor WebSocket!');
    });

    socket.on('nova_mensagem', function(data) {
        const mensagensDiv = document.getElementById('mensagens');
        const btn = document.getElementById('btn');
        const novaMsg = document.createElement('p');
        novaMsg.textContent = data.msg;
        mensagensDiv.innerText = novaMsg.textContent;
        btn.classList.toggle("hidden")
    });
</script>

{% endblock %}
